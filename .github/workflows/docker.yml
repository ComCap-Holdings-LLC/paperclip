name: Docker

on:
  push:
    branches:
      - "master"
    tags:
      - "v*"
      - "nightly/v*"
      - "beta/v*"
  # Release workflows push lane tags with GITHUB_TOKEN, and GitHub suppresses
  # push-triggered runs for those, so release.yml dispatches this workflow at
  # the new tag ref instead. The tag mapping below keys off github.ref either
  # way.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Serialise builds per ref without killing an in-flight one: a newer push
# supersedes only the pending slot, so the image build that is already
# running always finishes and publishes.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Image builds run on Mercury's locked-down builder, not in this job: hermes-ephemeral jobs have
  # no Docker by design (this is a public repo, and a shared daemon would let a fork PR job reach
  # the release image). The forced command `paperclip-build` accepts only a commit already on
  # master or a release tag and refetches it from GitHub itself, so this job only names what to
  # build. Tags, labels and build args live there: hermes-config mercury/paperclip/builder.
  # Images are amd64 only; production and managed hosts are amd64.
  build-and-push:
    runs-on: hermes-ephemeral
    timeout-minutes: 60
    steps:
      - name: Configure builder SSH identity
        env:
          BUILD_KEY: ${{ secrets.PAPERCLIP_BUILD_KEY }}
          BUILD_HOST_KEY: ${{ secrets.PAPERCLIP_BUILD_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/paperclip_build"
          printf '%s\n' "$BUILD_KEY" > "$HOME/.ssh/paperclip_build"
          printf '%s\n' "$BUILD_HOST_KEY" > "$HOME/.ssh/paperclip_build_known_hosts"

      - name: Build and push on the Mercury builder
        env:
          BUILD_HOST: ${{ secrets.PAPERCLIP_BUILD_HOST }}
          BUILD_TARGET: production
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/paperclip_build_known_hosts" \
            -o ServerAliveInterval=30 \
            -i "$HOME/.ssh/paperclip_build" \
            "pcbuild@${BUILD_HOST}" \
            "build ${BUILD_TARGET} ${GITHUB_SHA} ${GITHUB_REF}"

  # The cloud variant carries built bundled plugins for managed deployments (see the `cloud` stage
  # in the Dockerfile). It stays a separate job with no `needs:`, so a failure in one image never
  # gates the other.
  build-and-push-cloud:
    runs-on: hermes-ephemeral
    timeout-minutes: 60
    steps:
      - name: Configure builder SSH identity
        env:
          BUILD_KEY: ${{ secrets.PAPERCLIP_BUILD_KEY }}
          BUILD_HOST_KEY: ${{ secrets.PAPERCLIP_BUILD_HOST_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          install -m 0600 /dev/null "$HOME/.ssh/paperclip_build"
          printf '%s\n' "$BUILD_KEY" > "$HOME/.ssh/paperclip_build"
          printf '%s\n' "$BUILD_HOST_KEY" > "$HOME/.ssh/paperclip_build_known_hosts"

      - name: Build and push on the Mercury builder
        env:
          BUILD_HOST: ${{ secrets.PAPERCLIP_BUILD_HOST }}
          BUILD_TARGET: cloud
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf '%s\n' "$GHCR_TOKEN" | ssh \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/paperclip_build_known_hosts" \
            -o ServerAliveInterval=30 \
            -i "$HOME/.ssh/paperclip_build" \
            "pcbuild@${BUILD_HOST}" \
            "build ${BUILD_TARGET} ${GITHUB_SHA} ${GITHUB_REF}"
